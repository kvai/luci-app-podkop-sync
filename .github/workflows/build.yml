name: build-ipk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Новый пуш отменяет незавершённую сборку предыдущего: иначе две сборки
# наперегонки кладут пакет в один релиз, и остаться может более старый.
concurrency:
  group: build-ipk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # нужно для публикации Release

jobs:
  build:
    name: Build ${{ matrix.ext }} (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xiaomi Mi Router AX3000T — MediaTek MT7981B (mediatek/filogic).
          # Пакет PKGARCH=all — один файл ставится на любой роутер ветки,
          # поэтому берём rolling-тег ветки, а не конкретный минор.
          # SDK 24.10 собирает .ipk (opkg), SDK 25.12 — .apk (apk).
          - arch: aarch64_cortex-a53
            sdk: 24.10-SNAPSHOT
            ext: ipk
          - arch: aarch64_cortex-a53
            sdk: 25.12-SNAPSHOT
            ext: apk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Тесты идут ДО подстановки номера сборки: они проверяют исходники как есть.
      - name: Run tests
        env:
          PYTHONUTF8: "1"       # тесты и скрипты работают с кириллицей
          # без этого python оставляет рядом с парсером __pycache__, и он попадает в пакет
          PYTHONDONTWRITEBYTECODE: "1"
          LC_ALL: C.UTF-8
        run: |
          python3 tests/test_parser.py
          python3 -m unittest discover -s tests -p 'test_sync.py'
          find luci-app-podkop-sync -name '__pycache__' -prune -exec rm -rf {} +
          test -z "$(find luci-app-podkop-sync -name '*.pyc')"

      # Каждая сборка получает растущий номер выпуска (<версия>-r<номер запуска>):
      # менеджер пакетов видит её как более новую и обновляет поверх, без удаления.
      # Номер обязан быть числом: apk другой формат выпуска не принимает.
      # Тот же номер попадает в скрипт и показывается в интерфейсе.
      - name: Stamp build number
        run: |
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${GITHUB_RUN_NUMBER}/" luci-app-podkop-sync/Makefile
          sed -i "s/^RELEASE=.*/RELEASE=\"${GITHUB_RUN_NUMBER}\"/" luci-app-podkop-sync/root/usr/libexec/podkop_sub_service
          grep -n '^PKG_VERSION\|^PKG_RELEASE' luci-app-podkop-sync/Makefile
          grep -n '^VERSION=\|^RELEASE=' luci-app-podkop-sync/root/usr/libexec/podkop_sub_service

      - name: Build package (OpenWrt SDK)
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: podkop_sync_ci
          # имя каталога пакета внутри временного фида = имя репозитория
          PACKAGES: luci-app-podkop-sync
          NO_REFRESH_CHECK: 1

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find bin/ -name '*.ipk' -exec cp -v {} artifacts/ \; || true
          find bin/ -name '*.apk' -exec cp -v {} artifacts/ \; || true
          ls -l artifacts/
          # стабильное имя ассета для install.sh (releases/download/latest/...)
          pkg="$(find artifacts -name 'luci-app-podkop-sync*.${{ matrix.ext }}' | head -1)"
          [ -n "$pkg" ] || { echo "пакет .${{ matrix.ext }} не собран"; exit 1; }
          cp -v "$pkg" artifacts/luci-app-podkop-sync.${{ matrix.ext }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: luci-app-podkop-sync-${{ matrix.ext }}
          path: artifacts/*
          if-no-files-found: error

      # Публикуем rolling-релиз 'latest' со стабильными именами .ipk и .apk,
      # чтобы install.sh качал нужный формат по постоянному URL.
      - name: Publish rolling release 'latest'
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: latest
          prerelease: true
          files: artifacts/luci-app-podkop-sync.${{ matrix.ext }}
